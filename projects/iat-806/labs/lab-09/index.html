<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feed Me Anything!</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>
<body>
    <h1>Feed Me Anything!</h1>
    <p>Feed this imaginary pet anything you can think of and see how it reacts.</p>
    <input id="key" type="password" placeholder="OpenRouter API key">
    <div id="canvas"></div>
    <p id="status" aria-live="polite">Health: 0 / 100 | Mood: neutral</p>
    <h3 id="output" aria-live="polite">I'm hungry!</h3>

    <input id="food" placeholder="What should I eat?" maxlength="200">

    <button id="feed">Feed</button>
    <button id="reset">Reset pet</button>
<!--    <h2>Feeding history</h2>-->
<!--    <ul id="history"></ul>-->
    <p>Platform: OpenRouter. Model: nvidia/nemotron-3.5-super-vl:free.</p>
    <!-- Add your own reflection after testing the app. -->
    <script src="openrouter.js"></script>
    <script src="pet.js"></script>
    <script src="game.js"></script>
</body>
</html>
